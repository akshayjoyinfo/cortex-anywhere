# Cortex host, LOCAL profile, Windows. Source of truth for provisioning (ADR 014).
# Customer machines: applied by infra/windows/bootstrap.ps1 with the pinned dsc CLI.
# Our servers: applied by ansible.windows.dsc3 (infra/ansible/windows.yml).
# Every artifact is pinned by version and SHA256. Change a pin here, nowhere else.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  Cortex:
    profile: local
    document: 0.1.0
parameters:
  pgPort:
    type: int
    defaultValue: 5432
  httpPort:
    type: int
    defaultValue: 5080
  customerName:
    type: string
    defaultValue: local-customer
  tenantName:
    type: string
    defaultValue: local
  modelName:
    type: string
    defaultValue: 'qwen3:1.7b'
  # Our servers only (bootstrap.ps1 -OperatorAccess). Customer installs leave it off.
  operatorAccess:
    type: bool
    defaultValue: false
resources:
  - name: dotnet-sdk
    type: Cortex.Windows/DotnetSdk
    properties:
      # Field test builds on the box. Customer installs will ship a published app instead.
      version: 10.0.403
      url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-win-x64.zip
      sha512: 7a114c318fa7f1d9822991b534b2814d0e78386ceda816b371f5141acefe741d87ccb606ede06cadac8f9ac5070e32b708a67bbd1619ff5e5a7858a27874ef48
      installDir: 'C:\Program Files\Cortex\dotnet'

  - name: vc-runtime
    type: Cortex.Windows/VcRuntime
    properties:
      minVersion: '14.44.35211'
      url: https://download.visualstudio.microsoft.com/download/pr/e9604e21-4b79-4096-a4b3-1b63d4b55b4d/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe
      sha256: cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b

  - name: postgres
    type: Cortex.Windows/Postgres
    dependsOn:
      - "[resourceId('Cortex.Windows/VcRuntime', 'vc-runtime')]"
    properties:
      version: '16.15-5'
      url: https://get.enterprisedb.com/postgresql/postgresql-16.15-5-windows-x64-binaries.zip
      sha256: 43bb45f173a6f08cf1d29a97a6d8deb119e8e8093a24c00d2d1001a0ccaa8281
      installDir: 'C:\Program Files\Cortex\pgsql\16.15-5'
      dataDir: 'C:\ProgramData\Cortex\pgdata\16'
      serviceName: cortex-postgres
      port: "[parameters('pgPort')]"
      listenAddresses: localhost

  - name: pgvector
    type: Cortex.Windows/PgExtension
    dependsOn:
      - "[resourceId('Cortex.Windows/Postgres', 'postgres')]"
    properties:
      name: vector
      version: '0.8.7'
      # Built once by .github/workflows/pgvector-windows.yml against the PostgreSQL pin above.
      url: https://github.com/akshayjoyinfo/cortex-anywhere/releases/download/pgvector-0.8.7-pg16.15-5-windows-x64/pgvector-0.8.7-pg16.15-5-windows-x64.zip
      sha256: f59163246dbfc8b64533ced8b8633925f082d7491db8629635f2b7a5e88d1e54
      pgInstallDir: 'C:\Program Files\Cortex\pgsql\16.15-5'

  - name: cortex-db
    type: Cortex.Windows/Database
    dependsOn:
      - "[resourceId('Cortex.Windows/PgExtension', 'pgvector')]"
    properties:
      database: cortex
      ownerRole: cortex_owner
      appRole: cortex_app
      extensions: [vector]
      migrationsDir: 'C:\Program Files\Cortex\provisioning\db\migrations'
      pgInstallDir: 'C:\Program Files\Cortex\pgsql\16.15-5'
      port: "[parameters('pgPort')]"

  - name: db-checks
    type: Cortex.Windows/DbChecks
    dependsOn:
      - "[resourceId('Cortex.Windows/Database', 'cortex-db')]"
    properties:
      checks:
        - { file: rls_forced.sql, expect: empty }
        - { file: fail_closed.sql, expect: success }
        - { file: app_can_use_vector.sql, expect: success }
      checksDir: 'C:\Program Files\Cortex\provisioning\db\checks'
      migrationsDir: 'C:\Program Files\Cortex\provisioning\db\migrations'
      ownerRole: cortex_owner
      extensions: [vector]
      pgInstallDir: 'C:\Program Files\Cortex\pgsql\16.15-5'
      port: "[parameters('pgPort')]"

  - name: local-install
    type: Cortex.Windows/LocalInstall
    dependsOn:
      - "[resourceId('Cortex.Windows/DbChecks', 'db-checks')]"
    properties:
      configPath: 'C:\ProgramData\Cortex\config\cortex.json'
      customerName: "[parameters('customerName')]"
      tenantName: "[parameters('tenantName')]"
      database: cortex
      appRole: cortex_app
      appSecret: pg-app
      pgInstallDir: 'C:\Program Files\Cortex\pgsql\16.15-5'
      port: "[parameters('pgPort')]"
      httpPort: "[parameters('httpPort')]"
      modelEndpoint: http://127.0.0.1:11434/v1
      modelName: "[parameters('modelName')]"
      embeddingModelName: 'qwen3-embedding:0.6b'
      memoryKeySecret: memory-key
      agentName: assistant
      agentPrompt: "You are this customer's assistant. Every message the user sends is saved to their notes automatically, so never say you cannot remember something. Use their saved notes when they are relevant. If the notes do not contain the answer, say so plainly."
      agentTools: [search_memory]

  # Local model runtime. CPU build only; GPU libraries are not unpacked.
  - name: ollama
    type: Cortex.Windows/Ollama
    properties:
      version: '0.40.12'
      url: https://github.com/ollama/ollama/releases/download/v0.40.12/ollama-windows-amd64.zip
      sha256: 21814944f3e50d3f07b6bb3af75baddb96f59e91353c332ac9c5063b3bfd1041
      installDir: 'C:\Program Files\Cortex\ollama'
      modelsDir: 'C:\ProgramData\Cortex\ollama\models'
      logDir: 'C:\ProgramData\Cortex\ollama\logs'
      host: '127.0.0.1:11434'
      taskName: cortex-ollama

  # Models are pinned by manifest digest (registry.ollama.ai), verified after pull.
  - name: model-chat
    type: Cortex.Windows/OllamaModel
    dependsOn:
      - "[resourceId('Cortex.Windows/Ollama', 'ollama')]"
    properties:
      name: "[parameters('modelName')]"
      digest: 8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
      host: '127.0.0.1:11434'

  - name: model-embedding
    type: Cortex.Windows/OllamaModel
    dependsOn:
      - "[resourceId('Cortex.Windows/Ollama', 'ollama')]"
    properties:
      name: 'qwen3-embedding:0.6b'
      digest: ac6da0dfba84a81fdbfbaf330198c33cd77c4cdfc53e8bc50eb581914a15621d
      host: '127.0.0.1:11434'

  # The app as a Windows service. Built once by .github/workflows/app-windows.yml
  # (self contained: no SDK or .NET runtime needed on the machine).
  - name: app-service
    type: Cortex.Windows/AppService
    dependsOn:
      - "[resourceId('Cortex.Windows/LocalInstall', 'local-install')]"
      - "[resourceId('Cortex.Windows/OllamaModel', 'model-chat')]"
      - "[resourceId('Cortex.Windows/OllamaModel', 'model-embedding')]"
    properties:
      version: '0.5.0'
      url: https://github.com/akshayjoyinfo/cortex-anywhere/releases/download/app-0.5.0/cortex-app-0.5.0-win-x64.zip
      sha256: 6afe2a13b0cffbd62a7d78fb5c15b4d408ce4f95c977c32599a917203478e2ea
      installDir: 'C:\Program Files\Cortex\app'
      serviceName: cortex-web
      dependsOn: cortex-postgres
      configPath: 'C:\ProgramData\Cortex\config\cortex.json'
      httpPort: "[parameters('httpPort')]"
      # Exactly what the service account may read; the superuser secret must stay out of reach.
      readFiles:
        - 'C:\ProgramData\Cortex\config\cortex.json'
        - 'C:\ProgramData\Cortex\secrets\pg-app.dpapi'
        - 'C:\ProgramData\Cortex\secrets\memory-key.dpapi'
      denyFiles:
        - 'C:\ProgramData\Cortex\secrets\pg-superuser.dpapi'

  # Operator access for machines we run: Tailscale stays connected across reboots.
  - name: operator-access
    type: Cortex.Windows/TailscaleUnattended
    properties:
      enabled: "[parameters('operatorAccess')]"

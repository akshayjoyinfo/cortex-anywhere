- name: Ship infra and migrations (compose paths are repo relative)
  ansible.builtin.copy: { src: "{{ playbook_dir }}/../../{{ item }}", dest: /srv/cortex/repo/ }
  loop: [infra, db]
- name: Start stack
  ansible.builtin.command: docker compose -f /srv/cortex/repo/infra/compose/data.yml up -d
- name: Initialise OpenBao (transit, kv, approle) once
  ansible.builtin.script: files/openbao-init.sh
  args: { creates: /srv/cortex/.openbao-initialised }

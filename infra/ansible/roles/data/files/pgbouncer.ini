[databases]
cortex   = host=postgres port=5432 dbname=cortex
keycloak = host=postgres port=5432 dbname=keycloak

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Transaction mode: tenant is pinned with set_config(..., true) per transaction,
; so nothing tenant related survives on a pooled server connection.
pool_mode = transaction
max_prepared_statements = 200
default_pool_size = 20
max_client_conn = 500
ignore_startup_parameters = extra_float_digits
